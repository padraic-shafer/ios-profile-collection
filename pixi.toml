[workspace]
channels = ["conda-forge"]
name = "ios-profile-collection"
platforms = [{ platform = "linux-64", glibc = "2.17" }]
version = "2026.3.0"
requires-pixi = ">=0.82.1"

[feature.profile.dependencies]
bluesky-base = "==1.15.0"
bluesky-queueserver = "*"
matplotlib-base = ">=3.10"
networkx = ">=3.4.2,<4"
nslsii = "==0.11.8"
numpy = "*"
ophyd = ">=1.11.0"
pyepics = "*"
python = ">=3.12,<3.13"
semver = ">=3.0.4,<4"
tiled-client = "==0.2.9"
pyqt = "<6"
qtpy = "*"
amostra = "<=1.0"
hdf5-external-filter-plugins = ">=0.1.0,<0.2"
blosc-hdf5-plugin = ">=1.0.1,<2"
databroker = "==2.0.0"
epicscorelibs = ">=7.0.7.99.1.1,<8"
bluesky-tiled-plugins = "==2.0.2"
ophyd-async = ">=0.13.7,<0.14"
ca-certificates = ">=2026.10.19"
certifi = ">=2026.10.19"
pip = ">=26.2.2"

[feature.profile.pypi-dependencies]
pvxslibs = ">=1.3.2, <2"

[feature.qs.dependencies]
bluesky-queueserver = "*"
bluesky-httpserver = "*"

[feature.qs.tasks]
# This section needs some development work to understand the best way to
# thread the required configuration through both the task and files checked into
# the profile.  These will interact with the ansible roles for pushing out the
# systemd units
qs-backend = "start-re-manager --profile-dir=."
qs-server = "uvicorn --host localhost --port 60610 bluesky_httpserver.server:app"


[feature.terminal.dependencies]
ipython = ">=9.5.0"
pyside6 = "*"
numpy = ">2"


[feature.terminal.tasks]
start = "unset SESSION_MANAGER PYTHONPATH && MPLBACKEND=qtagg ipython --profile-dir=."
# pvs: walk every ophyd device and print the exact PV set the profile connects to.
# get_pv_types() is defined in sim/pv_inventory.py and injected via startup.
pvs = "ipython --profile-dir=. -c 'import sys; sys.path.insert(0,\".\"); from sim.pv_inventory import get_pv_types; get_pv_types(); exit()'"

[feature.sim.dependencies]
caproto = ">=1.1.1,!=1.2.0"
numpy = "*"
python = ">=3.12,<3.13"
redis-py = ">=4.0"

[feature.sim.tasks]
# Start the containerised external services (redis, kafka, zmq-proxy)
sim-up = "podman-compose -f sim/externals/podman-compose.yml up -d"

# Stop the containerised external services
sim-down = "podman-compose -f sim/externals/podman-compose.yml down"

# Start the caproto sim IOC (blocks; run in a separate terminal or background)
sim-iocs = { cmd = "python sim/run_iocs.py", env = { EPICS_CAS_AUTO_BEACON_ADDR_LIST = "no", EPICS_CAS_BEACON_ADDR_LIST = "127.0.0.1" } }

# List every PV served by the sim IOC
sim-list-pvs = "python sim/run_iocs.py --list-pvs"

# Print the PV inventory derived from ophyd device definitions
sim-pv-types = "python -c 'import sys; sys.path.insert(0,\".\"); from sim.pv_inventory import get_pv_types; get_pv_types()'"

# Full sim stack: start IOC (background), then launch the profile with stubs applied.
# The caproto IOC is started in the background; a brief sleep lets it bind before
# the profile loads.  Stop with Ctrl-C; the IOC process is cleaned up on exit.
sim-start = { cmd = "bash -c 'EPICS_CAS_AUTO_BEACON_ADDR_LIST=no EPICS_CAS_BEACON_ADDR_LIST=127.0.0.1 python sim/run_iocs.py &; IOC_PID=$!; sleep 3; trap \"kill $IOC_PID 2>/dev/null\" EXIT; MPLBACKEND=agg EPICS_CA_ADDR_LIST=127.0.0.1 EPICS_CA_AUTO_ADDR_LIST=NO ipython --profile-dir=. -c \"exec(open(\\\"sim/externals/pre_exec.py\\\").read())\" -i'" }

# Run the acceptance test suite against the sim IOC (non-interactive)
sim-test = { cmd = "bash -c 'EPICS_CAS_AUTO_BEACON_ADDR_LIST=no EPICS_CAS_BEACON_ADDR_LIST=127.0.0.1 python sim/run_iocs.py &; IOC_PID=$!; sleep 4; trap \"kill $IOC_PID 2>/dev/null\" EXIT; EPICS_CA_ADDR_LIST=127.0.0.1 EPICS_CA_AUTO_ADDR_LIST=NO python sim/run_tests.py'" }

# Drift check: compare real profile devices against the sim IOC (fast, no IOC needed).
# Exit 0 = no FAILs; exit 1 = gaps found (add PVGroups or run --write).
# Run this whenever startup/*.py devices change.
sim-check-drift = "python sim/check_drift.py"

# Drift check writing mode: regenerate sim/pv_inventory.py from the live walk.
# Review with: git diff sim/pv_inventory.py
sim-write-inventory = "python sim/check_drift.py --write"

[environments.terminal]
features = ["profile", "terminal"]
solve-group = "profile"

[environments.qs]
features = ["profile", "qs"]
solve-group = "profile"

[environments.sim]
features = ["profile", "sim"]
solve-group = "profile"
